document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"d07dfc35-890e-40f6-802e-983bc19a422f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"7c797408-815e-4626-b41d-0901b00911d1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* =========================================================\n     COLOR — Sunset / ochre / clay palette\n     Named after Igbo words where natural; otherwise descriptive.\n     ========================================================= */\n\n  /* --- Core brand: Ọbàrà (blood / deep clay red) is the signature.\n         Edódó (marigold) is the warm accent.\n         Àlà (earth) is the grounding neutral. --- */\n\n  /* Clay — primary brand (terracotta/ochre red) */\n  --clay-50:  #fdf4ee;\n  --clay-100: #fbe4d4;\n  --clay-200: #f5c4a1;\n  --clay-300: #eca372;\n  --clay-400: #e17f47;\n  --clay-500: #c85a26;          /* primary brand */\n  --clay-600: #a7471c;\n  --clay-700: #873818;\n  --clay-800: #5f2811;\n  --clay-900: #3a1809;\n\n  /* Marigold — secondary / highlight (edódó) */\n  --marigold-50:  #fdf6e3;\n  --marigold-100: #fae9b8;\n  --marigold-200: #f5d477;\n  --marigold-300: #eebb3a;\n  --marigold-400: #d9a019;\n  --marigold-500: #b88214;      /* accent */\n  --marigold-600: #8f6410;\n  --marigold-700: #684809;\n\n  /* Plum — contrast accent, used sparingly */\n  --plum-50:  #f7f1f4;\n  --plum-100: #ebd9e3;\n  --plum-300: #a8678a;\n  --plum-500: #6d2c4f;          /* plum */\n  --plum-700: #421630;\n  --plum-900: #1f0a17;\n\n  /* Forest — supportive (used in Archive / provenance labels) */\n  --forest-50:  #eef4ef;\n  --forest-100: #d0e0d4;\n  --forest-300: #6f9778;\n  --forest-500: #2e5d3a;\n  --forest-700: #153a1f;\n\n  /* Ink — neutrals, warm biased (never pure gray) */\n  --bone:       #faf5ec;        /* page background */\n  --cream:      #f3ead8;        /* surface raised */\n  --paper:      #ffffff;        /* card surface */\n  --sand:       #e8dfc9;        /* divider / low-emphasis surface */\n  --clay-dust:  #d6c8ad;        /* warm divider */\n  --ink-900:    #1a120b;        /* primary text */\n  --ink-700:    #3d2e1f;        /* secondary text */\n  --ink-500:    #6b5945;        /* tertiary text / placeholder */\n  --ink-300:    #a99983;        /* disabled */\n  --ink-100:    #d9cfbd;        /* hairline */\n\n  /* Semantic */\n  --success:  var(--forest-500);\n  --warning:  var(--marigold-500);\n  --danger:   #b33a2a;\n  --info:     var(--plum-500);\n\n  /* =========================================================\n     SEMANTIC COLOR ROLES — use these in components, not the raw scale\n     ========================================================= */\n  --bg:          var(--bone);\n  --bg-raised:   var(--cream);\n  --bg-card:     var(--paper);\n  --bg-inverse:  var(--ink-900);\n\n  --fg:          var(--ink-900);\n  --fg-muted:    var(--ink-700);\n  --fg-subtle:   var(--ink-500);\n  --fg-disabled: var(--ink-300);\n  --fg-inverse:  var(--bone);\n  --fg-on-clay:  var(--bone);\n\n  --border:          var(--ink-100);\n  --border-strong:   var(--clay-dust);\n  --border-accent:   var(--clay-500);\n\n  --brand:            var(--clay-500);\n  --brand-hover:      var(--clay-600);\n  --brand-press:      var(--clay-700);\n  --brand-soft:       var(--clay-100);\n  --brand-soft-fg:    var(--clay-700);\n\n  --accent:           var(--marigold-400);\n  --accent-soft:      var(--marigold-100);\n\n  --archival:         var(--forest-500);   /* provenance / elder / archive */\n  --archival-soft:    var(--forest-100);\n\n  --community:        var(--plum-500);     /* Ọha community layer */\n  --community-soft:   var(--plum-100);\n\n  /* =========================================================\n     TYPE — families, scale, tracking\n     ========================================================= */\n  --font-display: \"Outfit\", \"SF Pro Display\", -apple-system, system-ui, sans-serif;\n  --font-body:    \"DM Sans\", \"SF Pro Text\", -apple-system, system-ui, sans-serif;\n  --font-archive: \"Fraunces\", \"Iowan Old Style\", Georgia, serif;\n  --font-mono:    ui-monospace, \"JetBrains Mono\", SFMono-Regular, Menlo, monospace;\n\n  /* Modular scale — 1.2 ratio tuned for mobile + desktop */\n  --text-xs:   0.75rem;   /* 12 */\n  --text-sm:   0.875rem;  /* 14 */\n  --text-base: 1rem;      /* 16 */\n  --text-md:   1.125rem;  /* 18 */\n  --text-lg:   1.375rem;  /* 22 */\n  --text-xl:   1.75rem;   /* 28 */\n  --text-2xl:  2.25rem;   /* 36 */\n  --text-3xl:  3rem;      /* 48 */\n  --text-4xl:  4rem;      /* 64 */\n  --text-5xl:  5.5rem;    /* 88 — hero */\n\n  --leading-tight:   1.08;\n  --leading-snug:    1.25;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.7;\n\n  --tracking-tight:  -0.02em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-caps:   0.12em;\n\n  /* =========================================================\n     SPACING — 4px base\n     ========================================================= */\n  --s-0:  0;\n  --s-1:  0.25rem;   /* 4  */\n  --s-2:  0.5rem;    /* 8  */\n  --s-3:  0.75rem;   /* 12 */\n  --s-4:  1rem;      /* 16 */\n  --s-5:  1.5rem;    /* 24 */\n  --s-6:  2rem;      /* 32 */\n  --s-7:  2.5rem;    /* 40 */\n  --s-8:  3rem;      /* 48 */\n  --s-9:  4rem;      /* 64 */\n  --s-10: 6rem;      /* 96 */\n\n  /* =========================================================\n     RADII — generous, warm, never pill unless meaningful\n     ========================================================= */\n  --r-xs:   4px;\n  --r-sm:   8px;\n  --r-md:   12px;\n  --r-lg:   18px;\n  --r-xl:   24px;\n  --r-2xl:  32px;\n  --r-full: 999px;\n\n  /* =========================================================\n     SHADOWS — warm-toned, soft. Never blue-black.\n     Elevation implies importance, not novelty.\n     ========================================================= */\n  --shadow-xs:  0 1px 2px rgba(58, 24, 9, 0.06);\n  --shadow-sm:  0 2px 6px rgba(58, 24, 9, 0.08);\n  --shadow-md:  0 6px 18px rgba(58, 24, 9, 0.10);\n  --shadow-lg:  0 14px 40px rgba(58, 24, 9, 0.14);\n  --shadow-xl:  0 28px 72px rgba(58, 24, 9, 0.18);\n  --shadow-inset: inset 0 1px 2px rgba(58, 24, 9, 0.08);\n\n  /* Focus ring */\n  --ring:        0 0 0 3px rgba(200, 90, 38, 0.28);\n  --ring-accent: 0 0 0 3px rgba(217, 160, 25, 0.32);\n\n  /* =========================================================\n     MOTION\n     ========================================================= */\n  --ease-out:  cubic-bezier(0.2, 0.7, 0.2, 1);\n  --ease-in:   cubic-bezier(0.5, 0, 0.8, 0.3);\n  --ease-in-out: cubic-bezier(0.45, 0, 0.2, 1);\n  --ease-overshoot: cubic-bezier(0.34, 1.56, 0.64, 1);\n\n  --dur-fast: 120ms;\n  --dur-med:  220ms;\n  --dur-slow: 420ms;\n\n  /* Layout */\n  --maxw-prose:  64ch;\n  --maxw-app:    1200px;\n  --maxw-wide:   1440px;\n\n  /* Z */\n  --z-nav: 10;\n  --z-overlay: 50;\n  --z-modal: 60;\n  --z-toast: 70;\n}\n\n/* =========================================================\n   SEMANTIC TYPE STYLES — use these instead of raw scale where possible\n   ========================================================= */\n.display-1,\nh1.display {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: clamp(var(--text-3xl), 6vw, var(--text-5xl));\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\n.display-2 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: clamp(var(--text-2xl), 4.5vw, var(--text-4xl));\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n}\nh1, .h1 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--text-2xl);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\nh2, .h2 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: var(--text-xl);\n  line-height: var(--leading-snug);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n}\nh3, .h3 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: var(--text-lg);\n  line-height: var(--leading-snug);\n  color: var(--fg);\n}\n.eyebrow {\n  font-family: var(--font-body);\n  font-weight: 600;\n  font-size: var(--text-xs);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-caps);\n  color: var(--fg-subtle);\n}\np, .body {\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  color: var(--fg-muted);\n}\n.body-lg {\n  font-family: var(--font-body);\n  font-size: var(--text-md);\n  line-height: var(--leading-relaxed);\n  color: var(--fg-muted);\n}\n.body-sm {\n  font-family: var(--font-body);\n  font-size: var(--text-sm);\n  line-height: var(--leading-normal);\n  color: var(--fg-muted);\n}\n.caption {\n  font-family: var(--font-body);\n  font-size: var(--text-xs);\n  line-height: var(--leading-normal);\n  color: var(--fg-subtle);\n}\n.archive {\n  font-family: var(--font-archive);\n  font-weight: 400;\n  font-optical-sizing: auto;\n  font-variation-settings: \"SOFT\" 50, \"WONK\" 0;\n  color: var(--fg);\n}\n.archive-display {\n  font-family: var(--font-archive);\n  font-weight: 500;\n  font-size: clamp(var(--text-2xl), 5vw, var(--text-4xl));\n  line-height: 1.05;\n  letter-spacing: -0.015em;\n  color: var(--fg);\n}\n.mono {\n  font-family: var(--font-mono);\n  font-size: var(--text-sm);\n  color: var(--fg-muted);\n}\n\n/* Igbo text — tiny optical adjustments so combining tone marks\n   (\\u0301 acute, \\u0300 grave, \\u0304 macron, \\u0329 syllabic) sit right. */\n.igbo {\n  font-feature-settings: \"ccmp\" 1, \"mark\" 1, \"mkmk\" 1, \"ss01\" 1;\n  font-variant-ligatures: contextual;\n}\n\n/* =========================================================\n   BASE\n   ========================================================= */\nhtml, body {\n  background: var(--bg);\n  color: var(--fg);\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n::selection {\n  background: var(--clay-200);\n  color: var(--ink-900);\n}\n\n/* =========================================================\n   UTILITY — brand textures (used sparingly, respectfully)\n   Abstract rhythm pattern — NOT a specific traditional motif.\n   ========================================================= */\n.texture-paper {\n  background-color: var(--bone);\n  background-image:\n    radial-gradient(rgba(58,24,9,0.035) 1px, transparent 1px);\n  background-size: 14px 14px;\n}\n.texture-warm {\n  background:\n    radial-gradient(1200px 600px at 0% 0%, var(--clay-100) 0%, transparent 50%),\n    radial-gradient(900px 500px at 100% 100%, var(--marigold-100) 0%, transparent 55%),\n    var(--bone);\n}\n<\u002Fstyle>\n\n<style>\n  html, body { margin: 0; padding: 0; background: #1a120b; color: #1a120b; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  button { font-family: inherit; }\n  ::selection { background: #fbe4d4; color: #1a120b; }\n<\u002Fstyle>\n\n<!-- React + Babel -->\n<script src=\"1f5044f0-9bff-4ce1-b4a2-fbcb18e5bbc7\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js\" crossorigin=\"anonymous\"><\u002Fscript>\n<\u002Fhead>\n<body>\n  <div id=\"root\"><\u002Fdiv>\n\n  \n\n  <!-- Order matters: primitives → ios frame → screens → more components → app -->\n  <script type=\"text/babel\" data-presets=\"react\" src=\"1157f873-fe21-421e-943b-e0259dd6dea3\"><\u002Fscript>\n  <script type=\"text/babel\" data-presets=\"react\" src=\"acc37f17-60ff-41bb-a54b-a8117fb84f82\"><\u002Fscript>\n  <script type=\"text/babel\" data-presets=\"react\" src=\"76f5e75c-30a9-4c3c-9d4a-caed6efac115\"><\u002Fscript>\n  <script type=\"text/babel\" data-presets=\"react\" src=\"c4798039-6d12-44c1-b251-a31934b872dd\"><\u002Fscript>\n  <script type=\"text/babel\" data-presets=\"react\" src=\"2b936462-3585-46d0-b154-7ba096073bfb\"><\u002Fscript>\n  <script type=\"text/babel\" data-presets=\"react\" src=\"abc4ccc1-8cc8-4593-b794-55a22f0ed9c7\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
