# Quality gates (docs/07-testing-and-quality.md §9). Merge is blocked unless every job is green.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint # eslint + dependency-cruiser module boundaries
      - run: pnpm typecheck
      - run: pnpm db:check # drizzle migration journal + schema consistency
      - name: Migrations are committed for every schema change
        run: |
          pnpm db:generate --name ci-drift-check
          if [ -n "$(git status --porcelain apps/api/migrations)" ]; then
            echo "::error::Schema changed without a committed migration (run pnpm db:generate)"; git status --porcelain apps/api/migrations; exit 1
          fi
      - name: Secret scan of the full history (gitleaks CLI; the action needs a licence for orgs)
        run: >
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    # Testcontainers Postgres 18 (same major as Neon). Never a Neon branch with real data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  audio-worker:
    # Python + ffmpeg tests run inside the worker's own image (ADR-021).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nnoo-audio-worker apps/audio-worker
      - run: docker run --rm nnoo-audio-worker python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: The web bundle carries no server secrets or server URLs
        run: |
          if grep -rliE "postgres(ql)?://|x-edge-auth|neon\.tech|AUDIO_WORKER|AUTH_SECRET" apps/web/dist; then
            echo "::error::server-only value found in the web bundle"; exit 1
          fi

  e2e-web:
    # Playwright against the real API on a throwaway Postgres container (apps/api/scripts/e2e-server.ts).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nnoo/web exec playwright install --with-deps chromium
      - run: pnpm --filter @nnoo/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: apps/web/test-results, retention-days: 7 }
