# Production release (docs/neon/09 §1, §3). Runs only on a version tag, only after the
# `production` environment's required reviewers approve. Order: expand migrations →
# functions → clients. Never drops, truncates or rewrites anything automatically.
# Prerequisites (not yet done): nnoo-prod project, its id in infra/environments.json,
# GitHub environment `production` with NEON_PROD_API_KEY and the production env file.
name: release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  production:
    needs: verify
    runs-on: ubuntu-latest
    environment: production # required reviewers: 2 (docs/neon/09 §1)
    env:
      NEON_API_KEY: ${{ secrets.NEON_PROD_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROD_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npm i -g neon
      - name: Refuse unless production is registered and matches
        run: |
          test -n "$NEON_PROJECT_ID" || { echo "::error::NEON_PROD_PROJECT_ID is not set"; exit 1; }
          node -e 'const t=require("./infra/environments.json"); if (t.prod.neonProjectId !== process.env.NEON_PROJECT_ID) { console.error("project id mismatch with infra/environments.json"); process.exit(1) }'
      - name: Migrate production (expand only; lock_timeout 2s)
        run: |
          export MIGRATION_DATABASE_URL="$(neon connection-string main --project-id "$NEON_PROJECT_ID" --role-name nnoo_owner --database-name nnoo)"
          NNOO_ENV=production CI=true pnpm db:migrate -- --confirm-production
      - name: Deploy functions and triggers
        run: |
          umask 077
          printf '%s' "$PRODUCTION_ENV_FILE" > production.env
          neon deploy --branch main --env production.env --no-env-pull
          rm -f production.env
        env: { PRODUCTION_ENV_FILE: '${{ secrets.PRODUCTION_ENV_FILE }}' }
      - name: Post-deploy health
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' https://api.nnoo.app/v1/health)" = 200
